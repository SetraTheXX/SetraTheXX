<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Tuncay Ölmez — Developer Tooling, Application Security, Systems</title>
  <desc id="desc">Dark navy profile banner with cyan and violet accents, a TÖ monogram, and three engineering principles: inspect risk, bound execution, verify evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#11142b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1030 40) rotate(115) scale(350 430)">
      <stop stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(220 340) rotate(-32) scale(460 300)">
      <stop stop-color="#8b5cf6" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowCyan)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#334155" stroke-opacity="0.72"/>

  <g transform="translate(72 74)" filter="url(#shadow)">
    <rect width="148" height="148" rx="38" fill="#0f1d31" stroke="url(#accent)" stroke-width="2"/>
    <path d="M35 41h78M74 41v70M46 111h56" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <circle cx="106" cy="78" r="17" fill="#11142b" stroke="#a78bfa" stroke-width="5"/>
    <path d="M97 78l6 6 13-14" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="256" y="104" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">TUNCAY ÖLMEZ</text>
  <text x="256" y="157" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="43" font-weight="760">Tools that make engineering</text>
  <text x="256" y="207" fill="url(#accent)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="43" font-weight="760">safer, clearer, and verifiable.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="650">
    <rect x="256" y="244" width="178" height="38" rx="19" fill="#102438" stroke="#155e75"/>
    <circle cx="276" cy="263" r="5" fill="#22d3ee"/>
    <text x="290" y="268" fill="#cffafe">Developer tooling</text>

    <rect x="446" y="244" width="188" height="38" rx="19" fill="#1d1935" stroke="#5b21b6"/>
    <circle cx="466" cy="263" r="5" fill="#a78bfa"/>
    <text x="480" y="268" fill="#ede9fe">Application security</text>

    <rect x="646" y="244" width="142" height="38" rx="19" fill="#12262a" stroke="#0f766e"/>
    <circle cx="666" cy="263" r="5" fill="#34d399"/>
    <text x="680" y="268" fill="#d1fae5">Local-first</text>
  </g>

  <g transform="translate(860 75)" filter="url(#shadow)">
    <rect width="350" height="210" rx="22" fill="#08111f" fill-opacity="0.86" stroke="#334155"/>
    <circle cx="24" cy="24" r="5" fill="#fb7185"/>
    <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="24" r="5" fill="#34d399"/>
    <text x="82" y="30" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">engineering.contract</text>
    <path d="M20 48h310" stroke="#1e293b"/>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">
      <text x="24" y="83" fill="#64748b">01</text>
      <text x="58" y="83" fill="#e2e8f0">inspect</text>
      <text x="126" y="83" fill="#22d3ee">risk</text>
      <circle cx="316" cy="78" r="7" fill="#0e7490"/>
      <path d="M312 78l3 3 6-7" fill="none" stroke="#cffafe" stroke-width="2" stroke-linecap="round"/>

      <text x="24" y="122" fill="#64748b">02</text>
      <text x="58" y="122" fill="#e2e8f0">bound</text>
      <text x="112" y="122" fill="#a78bfa">execution</text>
      <circle cx="316" cy="117" r="7" fill="#6d28d9"/>
      <path d="M312 117l3 3 6-7" fill="none" stroke="#ede9fe" stroke-width="2" stroke-linecap="round"/>

      <text x="24" y="161" fill="#64748b">03</text>
      <text x="58" y="161" fill="#e2e8f0">verify</text>
      <text x="118" y="161" fill="#34d399">evidence</text>
      <circle cx="316" cy="156" r="7" fill="#047857"/>
      <path d="M312 156l3 3 6-7" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/>

      <text x="24" y="194" fill="#475569">status:</text>
      <text x="88" y="194" fill="#34d399">ready_to_review</text>
    </g>
  </g>

  <rect x="72" y="318" width="1138" height="2" rx="1" fill="url(#accent)" opacity="0.74"/>
</svg>
