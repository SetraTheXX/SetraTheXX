    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fde68a" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="600" height="190" rx="24" fill="url(#bg)"/>
