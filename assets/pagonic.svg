  <path d="M69 61l28 14" stroke="#fde68a" stroke-width="3"/>
  <circle cx="108" cy="105" r="15" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
  <path d="M108 96v11M108 113v1" stroke="#ffedd5" stroke-width="3" stroke-linecap="round"/>
  <text x="151" y="58" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">ARCHIVE SAFETY</text>
  <text x="151" y="94" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="29" font-weight="750">Pagonic</text>
  <text x="151" y="122" fill="#a8a29e" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Inspect before you extract</text>
