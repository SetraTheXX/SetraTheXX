<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc">
  <title id="title">Pagonic</title>
  <desc id="desc">Inspect ZIP archives for path traversal, compression bombs, unsupported methods, and structural errors before extraction.</desc>
